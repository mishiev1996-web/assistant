<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Змейка</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#111; color:#e5e5e5; font-family:'Helvetica Neue',Arial,sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; }
  h1 { font-size:28px; font-weight:700; letter-spacing:-0.5px; margin-bottom:4px; }
  .sub { font-size:13px; color:#555; margin-bottom:20px; }
  .score-row { display:flex; gap:32px; margin-bottom:16px; }
  .score-box { text-align:center; }
  .score-label { font-size:11px; color:#555; letter-spacing:1.5px; text-transform:uppercase; }
  .score-val { font-size:28px; font-weight:200; color:#fff; letter-spacing:-1px; }
  canvas { border:1px solid #2a2a2a; border-radius:12px; display:block; }
  .controls { margin-top:18px; display:flex; flex-direction:column; align-items:center; gap:5px; }
  .ctrl-row { display:flex; gap:5px; }
  .key { background:#1a1a1a; border:1px solid #2a2a2a; border-radius:7px; width:38px; height:38px; display:flex; align-items:center; justify-content:center; font-size:15px; color:#555; }
  #overlay { position:fixed; inset:0; background:rgba(0,0,0,.85); display:flex; align-items:center; justify-content:center; z-index:10; }
  #overlay.hidden { display:none; }
  .ob { background:#1a1a1a; border:1px solid #2a2a2a; border-radius:20px; padding:40px; text-align:center; min-width:280px; }
  .oi { font-size:48px; margin-bottom:12px; }
  .ot { font-size:22px; font-weight:700; margin-bottom:6px; }
  .os { font-size:14px; color:#555; margin-bottom:8px; }
  .osc { font-size:42px; font-weight:200; color:#4ade80; margin-bottom:24px; display:none; }
  .sbtn { background:#e5e5e5; color:#111; border:none; border-radius:10px; padding:13px 40px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; width:100%; }
</style>
</head>
<body>
<h1>Змейка</h1>
<p class="sub">управление стрелками · пробел — пауза</p>
<div class="score-row">
  <div class="score-box"><div class="score-label">Счёт</div><div class="score-val" id="sc">0</div></div>
  <div class="score-box"><div class="score-label">Рекорд</div><div class="score-val" id="bs">0</div></div>
  <div class="score-box"><div class="score-label">Уровень</div><div class="score-val" id="lv">1</div></div>
</div>
<canvas id="c"></canvas>
<div class="controls">
  <div class="ctrl-row"><div class="key">↑</div></div>
  <div class="ctrl-row"><div class="key">←</div><div class="key">↓</div><div class="key">→</div></div>
</div>
<div id="overlay">
  <div class="ob">
    <div class="oi" id="oi">🐍</div>
    <div class="ot" id="ot">Змейка</div>
    <div class="os" id="os">Собирай еду, не врезайся в стены и в себя</div>
    <div class="osc" id="osc"></div>
    <button class="sbtn" id="sbtn">Начать игру</button>
  </div>
</div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
const CELL=20,COLS=25,ROWS=25;
C.width=COLS*CELL; C.height=ROWS*CELL;
let snake,dir,nd,food,score,level,speed,loop,paused,running;
let best=parseInt(localStorage.getItem('sbest')||'0');
document.getElementById('bs').textContent=best;
function init(){
  snake=[{x:12,y:12},{x:11,y:12},{x:10,y:12}];
  dir={x:1,y:0}; nd={x:1,y:0};
  score=0; level=1; speed=150; paused=false; running=true;
  placeFood(); ui();
}
function placeFood(){
  let p;
  do { p={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)}; }
  while(snake.some(s=>s.x===p.x&&s.y===p.y));
  food=p;
}
function ui(){
  document.getElementById('sc').textContent=score;
  document.getElementById('bs').textContent=best;
  document.getElementById('lv').textContent=level;
}
function step(){
  if(paused||!running) return;
  dir={...nd};
  const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.x>=COLS||h.y<0||h.y>=ROWS){over();return;}
  if(snake.some(s=>s.x===h.x&&s.y===h.y)){over();return;}
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){
    score+=level*10;
    if(score>best){best=score;localStorage.setItem('sbest',best);}
    level=Math.floor(score/100)+1;
    speed=Math.max(60,150-(level-1)*10);
    placeFood(); clearInterval(loop); loop=setInterval(step,speed);
  } else { snake.pop(); }
  ui(); draw();
}
function draw(){
  X.fillStyle='#111'; X.fillRect(0,0,C.width,C.height);
  X.fillStyle='#1a1a1a';
  for(let x=0;x<COLS;x++) for(let y=0;y<ROWS;y++) X.fillRect(x*CELL+CELL/2-1,y*CELL+CELL/2-1,2,2);
  X.fillStyle='#f87171';
  X.beginPath(); X.arc(food.x*CELL+CELL/2,food.y*CELL+CELL/2,CELL/2-3,0,Math.PI*2); X.fill();
  snake.forEach((s,i)=>{
    const t=i/snake.length;
    const r=Math.round(74+(20-74)*t),g=Math.round(222+(120-222)*t),b=Math.round(128+(60-128)*t);
    X.fillStyle=`rgb(${r},${g},${b})`;
    const px=s.x*CELL+2,py=s.y*CELL+2,sz=CELL-4;
    X.beginPath(); X.roundRect(px,py,sz,sz,i===0?7:4); X.fill();
    if(i===0){
      X.fillStyle='#111';
      const ox=dir.x>0?sz-5:3, ox2=dir.x>0?sz-5:dir.x<0?3:sz-5;
      const oy=dir.y>0?sz-5:3, oy2=dir.y>0?sz-5:dir.y<0?3:sz-5;
      X.beginPath(); X.arc(px+ox,py+oy,2,0,Math.PI*2); X.fill();
      X.beginPath(); X.arc(px+ox2,py+oy2,2,0,Math.PI*2); X.fill();
    }
  });
  if(paused){
    X.fillStyle='rgba(0,0,0,.6)'; X.fillRect(0,0,C.width,C.height);
    X.fillStyle='#e5e5e5'; X.font='bold 28px Helvetica Neue'; X.textAlign='center';
    X.fillText('ПАУЗА',C.width/2,C.height/2);
    X.font='14px Helvetica Neue'; X.fillStyle='#555';
    X.fillText('Пробел — продолжить',C.width/2,C.height/2+32);
  }
}
function over(){
  running=false; clearInterval(loop);
  document.getElementById('oi').textContent='💀';
  document.getElementById('ot').textContent='Игра окончена';
  document.getElementById('os').textContent=score>=best&&score>0?'🏆 Новый рекорд!':'Попробуй ещё раз';
  const osc=document.getElementById('osc'); osc.style.display=''; osc.textContent=score;
  document.getElementById('sbtn').textContent='Играть снова';
  document.getElementById('overlay').classList.remove('hidden');
}
document.getElementById('sbtn').onclick=()=>{
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('osc').style.display='none';
  clearInterval(loop); init(); draw(); loop=setInterval(step,speed);
};
document.addEventListener('keydown',e=>{
  switch(e.key){
    case'ArrowUp':    if(dir.y!==1)  nd={x:0,y:-1}; e.preventDefault(); break;
    case'ArrowDown':  if(dir.y!==-1) nd={x:0,y:1};  e.preventDefault(); break;
    case'ArrowLeft':  if(dir.x!==1)  nd={x:-1,y:0}; e.preventDefault(); break;
    case'ArrowRight': if(dir.x!==-1) nd={x:1,y:0};  e.preventDefault(); break;
    case' ': if(!running)return; paused=!paused; draw(); e.preventDefault(); break;
  }
});
X.fillStyle='#111'; X.fillRect(0,0,C.width,C.height);
</script>
</body>
</html>
